name: Build macOS installer

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing repository variable SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing repository secret SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS DMG
        run: npm run package:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ICrackedSahil-macOS
          path: release/*.dmg
          if-no-files-found: error

